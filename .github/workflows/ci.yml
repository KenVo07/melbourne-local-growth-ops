name: CI

on:
  pull_request:
    branches:
      - main
      - integration/m1
  push:
    branches:
      - main
      - integration/m1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Scan repository snapshot for secrets
        run: node scripts/governance/check-secrets.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce dependency vulnerability threshold
        run: |
          pnpm governance:audit:self-test
          pnpm governance:audit

      - name: Verify dependency licence notice inventory
        run: pnpm governance:licenses

      - name: Install Playwright browser
        run: pnpm --filter @melbourne-local-growth-ops/ops-console exec playwright install --with-deps chromium

      - name: Verify workspace
        run: pnpm check
